# C-30（2026-10-24）：全平台打包矩阵 CI（报告 C-30 第 5 步）。
# 触发：推 v* tag 或手动 workflow_dispatch；三平台矩阵各出双架构安装包（D-01：无 ia32）。
# 签名公证：CSC_LINK / CSC_KEY_PASSWORD（win/mac 代码签名）与 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID（mac 公证）经 secrets 注入；机密为空时 electron-builder 跳过签名与公证（仅警告不失败），
# CSC_IDENTITY_AUTO_DISCOVERY=false 免去本机钥匙串身份探测（不影响将来 CSC_LINK 证书生效）。
# 测试步骤不阻塞出包：Linux 已知基线含 23+ 失败（报告 §1.3 / 附录 C），结果仍随 latest.json 上传供查验。
# 本地优先纪律：electron-builder 一律 --publish never（打包器不上传）；tag v* 由独立 publish job
# 用 gh 发布，workflow_dispatch 只出包不发布（保留人工检查产物的余地）。
name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # v49.108 / D274：tag 推送时先校验 tag 与 package.json version 一致，
  # 避免 latest.yml 的版本号与安装包实际版本错位（electron-updater 的比对真源是 package.json）。
  # workflow_dispatch（ref_type=branch）跳过校验。
  preflight:
    name: preflight (tag == package.json version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches package.json version
        run: node scripts/check-tag-version.mjs

  build:
    name: packages (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux：Electron 运行时系统库（测试套件的 electron 运行时需要）+ xvfb；
      # postinstall 的 ABI 验证走 ELECTRON_RUN_AS_NODE，无需图形栈。
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 xvfb

      - name: npm ci
        run: npm ci

      # U-06：npm 只装宿主架构的可选依赖，跨架构出包需显式补目标架构 fsrs 平台包。
      # D274 起 `@napi-rs/**` 已从安装包排除（主进程只做 PDF 文本抽取），不再安装目标架构 canvas。
      # better-sqlite3 v13 的 prebuilds/ 已内置全平台，由 afterPack 按目标架构裁剪。
      - name: Install cross-arch native optional deps
        shell: bash
        run: |
          VER=$(node -p "require('./node_modules/fsrs-rs-nodejs/package.json').version")
          # --force：平台分包声明了 os/cpu 限制，宿主架构不符时 npm 会拒装（EBADPLATFORM）；
          # 这里就是要装「非宿主」平台包，必须跳过该校验（仅作用于显式包）。
          case "${{ runner.os }}" in
            Windows) npm install --no-save --force "fsrs-rs-nodejs-win32-arm64-msvc@$VER" ;;
            macOS)   npm install --no-save --force "fsrs-rs-nodejs-darwin-x64@$VER" ;;
            Linux)   npm install --no-save --force "fsrs-rs-nodejs-linux-arm64-gnu@$VER" ;;
            *)       echo "unknown os"; exit 1 ;;
          esac

      # C-35c：一致性机器闸门（规则 1-8：未定义 Token / 颜色字面量棘轮 / !important+svg
      # 棘轮 / 动效时长 / 编辑器白名单 / IME 守卫 / hover-opacity 棘轮 / skin-audit+i18n-check）。
      # npm ci 之后、测试之前；这是阻断性步骤（无 continue-on-error）——基线只许变小。
      - name: Consistency lint (C-35 gate)
        run: npm run lint:consistency

      # 审计 C-4：渲染层类型检查进 CI，阻断性（无 continue-on-error）——此前 tsc 完全不在 CI 中。
      - name: Typecheck (blocking)
        run: npm run typecheck

      # 审计 F-6：主进程 JS 增量类型检查（tsconfig.electron.json 的 files 白名单，只许变多）
      - name: Typecheck electron (blocking)
        run: npm run typecheck:electron

      - name: Run tests (non-blocking; results uploaded below)
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a node scripts/run-tests.mjs
          else
            node scripts/run-tests.mjs
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/.results/latest.json
          if-no-files-found: ignore

      - name: Build renderer
        run: npm run build

      # 机密只在非空时注入 GITHUB_ENV——electron-builder 对「存在但为空」的 CSC_LINK 会当作
      # 证书路径解析（mac 实测：空串 resolveCscLinkPath 落到项目目录 → "not a file" 直接失败），
      # 空 = 不设置 = 走未签名路径（CSC_IDENTITY_AUTO_DISCOVERY=false 免钥匙串探测）。
      - name: Resolve signing secrets (inject only when provided)
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$IN_CSC_LINK" ] && echo "CSC_LINK=$IN_CSC_LINK" >> "$GITHUB_ENV" || true
          [ -n "$IN_CSC_KEY_PASSWORD" ] && echo "CSC_KEY_PASSWORD=$IN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV" || true
          [ -n "$IN_APPLE_ID" ] && echo "APPLE_ID=$IN_APPLE_ID" >> "$GITHUB_ENV" || true
          [ -n "$IN_APPLE_APP_SPECIFIC_PASSWORD" ] && echo "APPLE_APP_SPECIFIC_PASSWORD=$IN_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV" || true
          [ -n "$IN_APPLE_TEAM_ID" ] && echo "APPLE_TEAM_ID=$IN_APPLE_TEAM_ID" >> "$GITHUB_ENV" || true

      - name: Package (electron-builder, unsigned path without secrets)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          case "${{ runner.os }}" in
            Windows) npx electron-builder --win --publish never ;;
            macOS)   npx electron-builder --mac --publish never ;;
            Linux)   npx electron-builder --linux --publish never ;;
            *)       echo "unknown os"; exit 1 ;;
          esac

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  # v49.108 / D274：发布侧补全（保持 electron-builder --publish never 的纪律，
  # 由独立 job 用 runner 自带 gh 发布）。tag v* 推送时把三平台产物 + latest*.yml +
  # *.blockmap 一并上传；blockmap 是 electron-updater 差分下载的前提（此前线上 404）。
  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: List release assets
        run: ls -lh release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑已有 Release：先清掉旧版遗留的通用安装包（D274 起不再发布）。
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              case "$name" in
                *-win-setup.exe) gh release delete-asset "$TAG" "$name" || true ;;
              esac
            done
          else
            # 先建草稿：上传中途失败时 Release 不会公开，客户端也看不到半套资产。
            gh release create "$TAG" --draft --title "$TAG" --generate-notes $PRERELEASE
          fi

          # 安装包 / blockmap 先传，latest*.yml 最后传：避免客户端先看到指向缺失资产的更新。
          assets=()
          latest=()
          for f in release/*; do
            case "$f" in
              release/latest*.yml) latest+=("$f") ;;
              *) assets+=("$f") ;;
            esac
          done
          if [ ${#assets[@]} -gt 0 ]; then gh release upload "$TAG" "${assets[@]}" --clobber; fi
          if [ ${#latest[@]} -gt 0 ]; then gh release upload "$TAG" "${latest[@]}" --clobber; fi

          # 草稿转为正式发布（prerelease tag 保持 prerelease，不会成为 GitHub Latest）。
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" ]; then
            if [ -n "$PRERELEASE" ]; then
              gh release edit "$TAG" --draft=false --prerelease
            else
              gh release edit "$TAG" --draft=false
            fi
          fi
